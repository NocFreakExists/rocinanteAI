<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>rocinanteAI</title>
<link rel="icon" href="favicon.webp" type="image/webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=JetBrains+Mono:wght@400;500&family=Major+Mono+Display&family=Space+Grotesk:wght@400;500&family=Unbounded:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#4682B4;--panel:#396D91;--line:rgba(248,246,240,.2);--ink:#F8F6F0;--mute:#D0DFE9;--red:#FF7F50;--rose:#F8F6F0;--page:#4682B4;--shadow:rgba(20,45,65,.32);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--page:#4682B4;--shadow:rgba(20,45,65,.4)}}
:root[data-theme="dark"]{--page:#4682B4;--shadow:rgba(20,45,65,.4)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--page);color:var(--ink);font-family:"Space Grotesk",system-ui,sans-serif;display:flex;align-items:center;justify-content:center;padding:16px;overflow-x:hidden}
.shell{width:100%;max-width:1040px;background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:clamp(14px,3vw,36px);box-shadow:0 30px 60px var(--shadow)}
.mast{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:clamp(14px,2.4vw,24px)}
.logo{display:flex;align-items:center;gap:12px}
.logo img{height:clamp(40px,6vw,54px);width:auto;filter:drop-shadow(0 0 12px rgba(255,127,80,.35))}
.wm{font:500 clamp(20px,2.8vw,30px)/1 "Unbounded",sans-serif;letter-spacing:-.045em;color:var(--ink)}
.wm em{font:500 .38em "JetBrains Mono",monospace;font-style:normal;letter-spacing:.1em;color:var(--red);margin-left:5px;vertical-align:.95em}
.tag{font:400 11px "JetBrains Mono",monospace;letter-spacing:.1em;color:var(--mute);text-align:right}
@media (max-width:480px){.tag{display:none}}
[hidden]{display:none!important}
.card{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:grid;grid-template-columns:clamp(210px,30%,280px) 1fr;align-items:stretch}
.stage{position:relative;overflow:hidden;aspect-ratio:1/2;border-right:1px solid var(--line)}
.rec{position:absolute;left:-100%;top:0;width:200%;aspect-ratio:1;display:block;overflow:visible}
#plat{transform-box:fill-box;transform-origin:center;animation:spin 3.6s linear infinite;animation-play-state:paused}
.playing #plat{animation-play-state:running}
@keyframes spin{to{transform:rotate(360deg)}}
#ring{cursor:pointer;outline:none}
#ring:focus-visible{stroke:rgba(255,255,255,.35)}
.clock{display:flex;padding-top:0!important;border:0!important;align-items:center;gap:12px;font:400 12px "JetBrains Mono",monospace;color:var(--mute);letter-spacing:.06em}
.clock b{font-weight:500;color:var(--ink)}
.clock i{width:28px;height:1px;background:var(--line);display:block}
.info{display:flex;flex-direction:column;gap:20px;min-width:0;justify-content:center;padding:clamp(20px,4vw,40px)}
.info>*+*{padding-top:20px;border-top:1px solid var(--line)}
.brand{font:500 11px "JetBrains Mono",monospace;letter-spacing:.12em;color:var(--rose);opacity:.8;margin:0}
h1{font:400 clamp(22px,3.2vw,34px)/1.15 "Major Mono Display",monospace;letter-spacing:-.04em;margin:0;overflow-wrap:anywhere}
.sub{font:italic 400 17px "EB Garamond",serif;color:var(--mute);margin:6px 0 0;min-height:1.4em}
canvas{width:100%;height:76px;display:block}
.row{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.grp{display:flex;align-items:center;gap:14px}
button{font:inherit;color:#9aa0a8;background:none;border:0;padding:6px;cursor:pointer;display:grid;place-items:center;border-radius:50%}
button:hover{color:#fff}
button:focus-visible,#gv:focus-visible,.drop:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
button svg{width:24px;height:24px;fill:currentColor}
.play{width:46px;height:46px;background:var(--red);color:#fff;box-shadow:0 0 16px rgba(255,127,80,.45)}
.play:hover{background:#f0495a}
/* frosted glass volume, tuned to the obsidian theme */
.vw{--v:.8;position:relative;flex:1;min-width:190px;max-width:260px}
.vw:before{content:"";position:absolute;left:calc(var(--v)*(100% - 40px));top:-4px;width:40px;height:44px;border-radius:50%;background:rgba(255,127,80,.75);filter:blur(13px);transition:opacity .2s}
.vw:after{content:"";position:absolute;left:8%;top:12px;width:30%;height:30px;border-radius:50%;background:rgba(248,246,240,.2);filter:blur(16px)}
#gv{position:relative;z-index:1;height:44px;border-radius:22px;overflow:hidden;cursor:ew-resize;touch-action:none;user-select:none;
 background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(16px) saturate(1.6);-webkit-backdrop-filter:blur(16px) saturate(1.6);
 box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 6px 18px rgba(0,0,0,.45)}
#gf{position:absolute;left:0;top:0;bottom:0;width:calc(2px + var(--v)*(100% - 2px));background:linear-gradient(90deg,rgba(255,127,80,.5),rgba(255,127,80,.32))}
#gt{position:absolute;top:50%;left:calc(var(--v)*(100% - 2px));width:2px;height:20px;margin-top:-10px;background:#fff;box-shadow:0 0 10px var(--red),0 0 2px #fff}
.dt{position:absolute;top:50%;width:3px;height:3px;margin:-1.5px 0 0 -1.5px;border-radius:50%;background:rgba(255,255,255,.28)}
#gv .lb,#gv .nm{position:absolute;top:0;bottom:0;display:flex;align-items:center;font-size:13px;color:#ececf0}
#gv .lb{left:16px;font-family:"Space Grotesk",sans-serif}
#gv .nm{right:16px;font:500 12px "JetBrains Mono",monospace;letter-spacing:.04em;color:var(--rose)}
.stamp{align-self:flex-start;display:flex;align-items:stretch;border:1px solid rgba(255,255,255,.14);background:#315B7B;max-width:100%}
.vu{width:66px;padding:6px 8px 4px;border-right:1px solid rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center;overflow:hidden;background:#F8F6F0}
.vu svg{width:100%;display:block;flex:none}
.vu .arc{stroke:#31536D}.vu .hot{stroke:var(--red)}
#needle{stroke:#31536D;transform-origin:32px 36px;transform:rotate(-60deg);transition:transform .18s ease-out}
.stamp .txt{padding:6px 16px 6px 14px;display:flex;flex-direction:column;justify-content:center;gap:0;min-width:0}
.info>.stamp{padding-top:0}
.stamp .k{font:500 10px "JetBrains Mono",monospace;letter-spacing:.12em;color:var(--mute)}
#pred{font:italic 400 19px/1.15 "EB Garamond",serif;color:var(--ink)}
.stamp[data-s="out"] #pred{font-style:normal;color:var(--rose)}
.stamp .k{display:none}
.stamp[data-s="idle"],.stamp[data-s="out"]{align-self:stretch;min-height:118px}
.stamp[data-s="out"]{align-self:stretch;min-height:118px;background:linear-gradient(115deg,rgba(255,127,80,.22),rgba(49,91,123,.92) 62%);border:1px solid rgba(255,127,80,.82);box-shadow:0 12px 34px rgba(12,34,52,.25),0 0 24px rgba(255,127,80,.12)}
.stamp[data-s="idle"] .vu,.stamp[data-s="out"] .vu{width:120px;padding:8px}
.stamp[data-s="idle"] .txt,.stamp[data-s="out"] .txt{gap:6px;padding:18px 24px}
.stamp[data-s="idle"] .k,.stamp[data-s="out"] .k{display:block;color:#FFD1C2}
.stamp[data-s="idle"] #pred,.stamp[data-s="out"] #pred{font:500 clamp(25px,3.5vw,42px)/1.08 "Major Mono Display",monospace;letter-spacing:-.055em;overflow-wrap:anywhere;text-shadow:0 2px 18px rgba(0,0,0,.18)}
.stamp[data-s="idle"] .m,.stamp[data-s="out"] .m{font-size:12px;color:var(--ink);opacity:.88}
.stamp[data-s="think"] #pred:after,.stamp[data-s="listen"] #pred:after{content:"";display:inline-block;width:1.2em;animation:dots 1.4s steps(4) infinite;vertical-align:bottom}
@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
.stamp .m{font:400 11px "JetBrains Mono",monospace;color:var(--mute)}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.drop{font:500 12px "JetBrains Mono",monospace;letter-spacing:.06em;color:var(--ink);border:1px solid rgba(255,255,255,.15);background:none;padding:10px 14px;border-radius:0;cursor:pointer}
.drop:hover,.drop.over{border-color:var(--ink)}
.drop{flex:1;min-width:220px;color:var(--mute);text-align:center}
.note{font-size:12px;color:var(--mute);margin:14px 0 0;line-height:1.5}
@media (max-width:760px){
 .card{grid-template-columns:1fr}
 .stage{aspect-ratio:auto;height:186px;border-right:0;border-bottom:1px solid var(--line)}
 .rec{width:360px;left:50%;margin-left:-180px}
 .vw{max-width:none}
}
@media (prefers-reduced-motion:reduce){#plat,#pred:after{animation:none}#needle{transition:none}}

/* Full-window player without the history sidebar. */
html,body{height:100%;height:100dvh;overflow:hidden}
body{display:block;padding:0;background:var(--bg)}
.shell{width:100%;height:100%;max-width:none;margin:0;border:0;border-radius:0;padding:clamp(14px,2vw,26px);box-shadow:none;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;gap:clamp(12px,2vw,22px);overflow:hidden;justify-content:center;transition:grid-template-columns .8s cubic-bezier(.22,.61,.36,1)}
.mast{grid-column:1;grid-row:1;margin:0;justify-content:flex-start}
.card{grid-column:1;grid-row:2;width:min(100%,1180px);max-width:1180px;max-height:min(780px,calc(100dvh - 170px));min-height:0;justify-self:center;align-self:center;transition:max-width .8s cubic-bezier(.22,.61,.36,1),width .8s cubic-bezier(.22,.61,.36,1)}
.stage{min-height:0}
.info{padding:clamp(28px,4.5vw,56px);gap:clamp(22px,2.6vw,30px)}
.tools{grid-column:1;grid-row:3;width:min(100%,1180px);margin:0;justify-self:center}

/* Requested palette and display faces. */
.brand{font-family:"Major Mono Display",monospace}
.stamp{background:#315B7B;border-color:rgba(248,246,240,.28)}
#pred{color:var(--ink)}
.play{background:var(--red);box-shadow:0 0 16px rgba(255,127,80,.38)}
.play:hover{background:#FF9876}
#plat{animation-duration:12s;animation-play-state:running}
.playing #plat{animation-duration:3.6s}
.tonearm{transform-origin:378px 60px;transition:transform .65s cubic-bezier(.2,.8,.2,1)}
.playing .tonearm{transform:rotate(-4deg)}
@media(max-width:760px){
 .shell{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;gap:10px;padding:12px}
 .mast{grid-column:1;grid-row:1}
 .card{grid-column:1;grid-row:2;max-height:calc(100dvh - 170px)}
 .tools{grid-column:1;grid-row:3}
}
@media(prefers-reduced-motion:reduce){.tonearm{transition:none}}

/* Keep the record moving, with a subtle groove-following tonearm tick. */
#plat{animation:spin 15s linear infinite!important;animation-play-state:running!important;transform-box:fill-box;transform-origin:center}
.playing #plat{animation-duration:5.8s!important}
@keyframes tonearmGroove{
 0%,7%,10%,28%,30%,61%,64%,87%,89%,100%{transform:rotate(-4deg)}
 8%,62%{transform:rotate(-4.55deg)}
 9%,63%{transform:rotate(-3.82deg)}
 29%,88%{transform:rotate(-4.38deg)}
}
.playing .tonearm{animation:tonearmGroove 2.8s steps(1,end) infinite;transition:none}
@media(prefers-reduced-motion:reduce){#plat{animation:spin 15s linear infinite!important}.playing #plat{animation-duration:5.8s!important}}
</style>
</head>

     <radialGradient id="rg" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#FF9876"/><stop offset="1" stop-color="#FF7F50"/></radialGradient>
     <clipPath id="dc"><circle cx="210" cy="210" r="168"/></clipPath>
    </defs>
    <circle cx="210" cy="210" r="168" fill="#F28C68" opacity=".4" style="filter:blur(22px)"/>
    <g id="plat">
     <circle cx="210" cy="210" r="168" fill="url(#rg)"/>
     <g id="gr" fill="none" stroke="rgba(0,0,0,.2)"></g>
     <circle cx="210" cy="210" r="58" fill="#121316" stroke="rgba(255,255,255,.1)"/>
     <circle cx="210" cy="210" r="47" fill="none" stroke="rgba(255,255,255,.08)" stroke-dasharray="2 5"/>
     <circle cx="210" cy="210" r="5" fill="#FF7F50"/>
    </g>
    <g class="tonearm" aria-hidden="true">
     <circle cx="378" cy="60" r="10" fill="#F8F6F0" stroke="#31536D" stroke-width="3"/>
     <circle cx="378" cy="60" r="3" fill="#FF7F50"/>
     <path d="M372 67L326 104L308 139" fill="none" stroke="#F8F6F0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
     <path d="M308 139L303 151" fill="none" stroke="#FF7F50" stroke-width="3" stroke-linecap="round"/>
    </g>
    <g clip-path="url(#dc)" fill="rgba(255,255,255,.07)" pointer-events="none"><path d="M210 210L90 40 250 30Z"/><path d="M210 210L330 380 170 390Z"/></g>
    <circle cx="210" cy="210" r="192" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="2"/>
    <circle id="pg" cx="210" cy="210" r="192" fill="none" stroke="#f5f5f7" stroke-width="3" stroke-linecap="round" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100" transform="rotate(-90 210 210)"/>
    <line id="ph" x1="210" y1="10" x2="210" y2="26" stroke="#FF7F50" stroke-width="3" stroke-linecap="round" style="filter:drop-shadow(0 0 5px rgba(255,127,80,.9))"/>
    <circle id="ring" cx="210" cy="210" r="192" fill="none" stroke="transparent" stroke-width="30" tabindex="0" role="slider" aria-label="Seek" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" transform="rotate(-90 210 210)"/>
   </svg>
  </div>
  <section class="info">
   <div>
    <h1 id="title">Drop a record</h1>
   </div>
   <div><div class="clock"><b id="cur">00:00</b><i></i><span id="dur">00:00</span></div>
   <canvas id="spec" aria-label="Live spectrum" style="margin-top:12px"></canvas></div>
   <div class="row">
    <div class="grp">
     <button id="prev" aria-label="Previous track"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zM9.5 12 18 18V6z"/></svg></button>
     <button class="play" id="play" aria-label="Play"><svg viewBox="0 0 24 24" id="pi"><path d="M8 5v14l11-7z"/></svg></button>
     <button id="next" aria-label="Next track"><svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg></button>
    </div>
    <div class="vw" id="vw">
     <div id="gv" role="slider" tabindex="0" aria-label="Volume" aria-valuemin="0" aria-valuemax="100" aria-valuenow="80">
      <div id="gf"></div><i class="dt" style="left:25%"></i><i class="dt" style="left:50%"></i><i class="dt" style="left:75%"></i><div id="gt"></div>
      <span class="lb">Volume</span><span class="nm" id="gn">80</span>
     </div>
    </div>
   </div>
   <div class="stamp" id="stamp" data-s="idle" aria-live="polite">
    <div class="vu"><svg viewBox="0 0 64 40" aria-hidden="true"><path class="arc" d="M6 36A26 26 0 0 1 44 13" fill="none" stroke-width="1.5"/><path class="hot" d="M44 13A26 26 0 0 1 58 36" fill="none" stroke-width="3"/><path class="arc" d="M32 6v4M14 14l3 3M50 14l-3 3" stroke-width="1"/><line id="needle" x1="32" y1="36" x2="32" y2="10" stroke-width="1.5"/><circle cx="32" cy="36" r="2.5" fill="#31536D"/></svg></div>
    <div class="txt"><span class="k">PLAYER STATUS</span><span id="pred">Needle up</span><span class="m" id="meta">Side A · 33⅓ rpm</span></div>
   </div>
  </section>
 </main>
 <div class="tools">
  <button class="drop" id="drop">DROP AUDIO FILES HERE OR CLICK TO BROWSE</button>
  <input type="file" id="file" accept="audio/*" multiple hidden>
 </div>
</div>
<script>
(function(){
var $=function(i){return document.getElementById(i)};
var audio=new Audio(),tracks=[],idx=-1,ctx,an,src,data,vinylClicks=0,stats={c:0,e:0,f:0,n:0,prev:null};
var card=$('card'),cv=$('spec'),g=cv.getContext('2d');
(function(){var h='';for(var r=64;r<=162;r+=9)h+='<circle cx="210" cy="210" r="'+r+'"/>';$('gr').innerHTML=h})();
$("plat").addEventListener('click',function(){
 vinylClicks++;
 if(vinylClicks===67)enterDQJS();
});
function enterDQJS(){
 try{
  var fullscreenRequest=document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen({navigationUI:'hide'});
  if(fullscreenRequest&&fullscreenRequest.catch)fullscreenRequest.catch(function(){});
 }catch(_){}
 var scareAudio=new Audio('dsjq-audio.mp3');
 scareAudio.loop=true;scareAudio.preload='auto';
 window.__dqjsScareAudio=scareAudio;
 scareAudio.play().catch(function(){});
 audio.pause();
 var style=document.createElement('style');
 style.textContent='html,body{width:100%;height:100%;height:100dvh;margin:0;overflow:hidden;background:#050505}body{position:fixed;inset:0}#dqjsScare{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;animation:dqjsAppear .22s ease-out both}#dqjsRed{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,rgba(150,0,12,.18) 20%,rgba(110,0,10,.48) 100%),linear-gradient(180deg,rgba(255,20,30,.2),rgba(90,0,8,.36));mix-blend-mode:multiply;animation:dqjsBloodPulse 2.8s ease-in-out infinite}@keyframes dqjsAppear{from{opacity:.15;transform:scale(1.035)}to{opacity:1;transform:scale(1)}}@keyframes dqjsBloodPulse{0%,100%{opacity:.68}50%{opacity:1}}@media(prefers-reduced-motion:reduce){#dqjsScare,#dqjsRed{animation:none}}';
 document.head.appendChild(style);
 document.body.replaceChildren();
 var image=document.createElement('img');image.id='dqjsScare';image.src='dqjs.png';image.alt='';image.draggable=false;
 var overlay=document.createElement('div');overlay.id='dqjsRed';overlay.setAttribute('aria-hidden','true');
 document.body.append(image,overlay);document.title='—';
 try{history.pushState({dqjs:true},'','dqjs.html')}catch(_){window.location.href='dqjs.html'}
}
audio.volume=.8;
function fmt(s){if(!isFinite(s))return'00:00';var m=Math.floor(s/60),x=Math.floor(s%60);return(m<10?'0':'')+m+':'+(x<10?'0':'')+x}
function setup(){
 if(ctx)return;
 ctx=new(window.AudioContext||window.webkitAudioContext)();
 an=ctx.createAnalyser();an.fftSize=512;an.smoothingTimeConstant=.78;
 src=ctx.createMediaElementSource(audio);src.connect(an);an.connect(ctx.destination);
 data=new Uint8Array(an.frequencyBinCount);
}

function addFiles(fl){
 var a=[].slice.call(fl).filter(function(f){return /^audio\//.test(f.type)||/\.(mp3|wav|flac|ogg|m4a|aac)$/i.test(f.name)});
 if(!a.length){$('sub').textContent='No audio found — try MP3, WAV, FLAC, OGG or M4A';return}
 var first=tracks.length;
 a.forEach(function(f){var i=tracks.length;tracks.push({name:f.name.replace(/\.[^.]+$/,''),url:URL.createObjectURL(f),dur:0,tag:'—'});predictFile(f,i)});
 load(first,true);
}
function predictFile(file,i){
 var body=new FormData();body.append('audio',file,file.name||'audio.wav');
 fetch('/predict',{method:'POST',body:body}).then(function(r){return r.json().then(function(data){if(!r.ok)throw new Error(data.error||'Prediction service unavailable');return data})}).then(function(data){if(!tracks[i])return;tracks[i].tag=data.label;if(i===idx){stats.n=Math.max(stats.n,40);pred('Output: '+data.label)}}).catch(function(e){if(i===idx)$('sub').textContent='Model connection failed — start rocinante_server.py';console.error(e)})
}
function load(i,play){
 if(i<0||i>=tracks.length)return;
 idx=i;audio.src=tracks[i].url;$('title').textContent=tracks[i].name;
 $('sub').textContent='Track '+(i+1)+' of '+tracks.length;
 stats={c:0,e:0,f:0,n:0,prev:null};pred('Prediction: Listening');
 if(play)toggle(true);
}
function toggle(force){
 if(idx<0)return;
 var want=force===undefined?audio.paused:force;
 if(!want){audio.pause();return}
 try{setup()}catch(e){console.warn('Audio analyser unavailable; playing without visualization.',e)}
 var ready=ctx&&ctx.state==='suspended'?ctx.resume():Promise.resolve();
 ready.then(function(){if(idx>=0)return audio.play()}).catch(function(e){$('sub').textContent='Playback could not start — press play to retry';console.error(e)});
}
function pred(t){
 var o=t.indexOf('Output: ')===0,s=o?'out':/Listening/.test(t)?'listen':/Thinking/.test(t)?'think':'idle';
 $('stamp').dataset.s=s;
 $('stamp').querySelector('.k').textContent=o?'GENRE OUTPUT':s==='idle'?'PLAYER STATUS':'PLAYBACK STATUS';
 $('pred').textContent=o?t.slice(8):{idle:'Needle up',listen:'Dropping the needle',think:'Dropping the needle'}[s];
 $('meta').textContent={idle:'Nothing on the platter',listen:'Side A · 33⅓ rpm',think:'Side A · 33⅓ rpm',out:'Read from the grooves · '+stats.n+' passes'}[s];
}
function classify(){
 if(stats.n<40)return'Prediction: Thinking';
 var c=stats.c/stats.n,e=stats.e/stats.n,f=stats.f/stats.n,l;
 if(e<.08)l='Ambient / Sparse';else if(c<.07&&f>.02)l='Bass-forward / Electronic';else if(c<.1)l='Warm / Acoustic';else if(f>.03)l='Percussive / Rhythmic';else l='Bright / Melodic';
 return'Output: '+l;
}
function draw(){
 requestAnimationFrame(draw);
 var W=cv.clientWidth,H=cv.clientHeight,d=window.devicePixelRatio||1;
 if(cv.width!==Math.round(W*d)){cv.width=Math.round(W*d);cv.height=Math.round(H*d)}
 g.setTransform(d,0,0,d,0,0);g.clearRect(0,0,W,H);
 var bars=Math.floor(W/4),has=an&&!audio.paused;
 if(has)an.getByteFrequencyData(data);
 var prog=audio.duration?audio.currentTime/audio.duration:0,sum=0,w=0,flux=0,pv=[];
 for(var i=0;i<bars;i++){
  var bi=Math.floor(Math.pow(i/bars,1.7)*(data?data.length*.8:1)),val=has?data[bi]/255:.04+.02*Math.sin(i*.4+performance.now()/900);
  sum+=val;w+=val*(i/bars);if(stats.prev)flux+=Math.abs(val-(stats.prev[i]||0));pv.push(val);
  var h=Math.max(2,val*H*.9);
  g.fillStyle=i/bars<prog?'#f5f5f7':'rgba(255,255,255,.2)';g.fillRect(i*4,(H-h)/2,2,h);
 }
 g.fillStyle='#FF7F50';g.fillRect(Math.floor(prog*W),0,1,H);
 var an2=prog*2*Math.PI-Math.PI/2,ca=Math.cos(an2),sa=Math.sin(an2),ph=$('ph');
 $('pg').setAttribute('stroke-dashoffset',100-prog*100);
 ph.setAttribute('x1',210+ca*182);ph.setAttribute('y1',210+sa*182);ph.setAttribute('x2',210+ca*202);ph.setAttribute('y2',210+sa*202);
 if(has){
  $('needle').style.transform='rotate('+(-60+Math.min(1,sum/bars*2.6)*120)+'deg)';
  stats.c+=w/(sum||1);stats.e+=sum/bars;stats.f+=flux/bars;stats.n++;stats.prev=pv;
  /* Prediction comes from the local rocinanteAI.pkcls service. */
 }
}
function ui(){
 var p=!audio.paused;card.classList.toggle('playing',p);if(!p)$('needle').style.transform='rotate(-60deg)';
 $('pi').innerHTML=p?'<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>':'<path d="M8 5v14l11-7z"/>';
 $('play').setAttribute('aria-label',p?'Pause':'Play');
 if(!p&&idx<0)pred('Prediction: Idle');
 else if(p&&stats.n<40)pred('Prediction: Listening');
}
audio.addEventListener('play',function(){
 if(idx<0||!tracks[idx]){audio.pause();ui();pred('Prediction: Idle');return}
 ui();
});audio.addEventListener('pause',ui);
audio.addEventListener('ended',function(){idx<tracks.length-1?load(idx+1,true):ui()});
audio.addEventListener('loadedmetadata',function(){if(tracks[idx]){tracks[idx].dur=audio.duration;$('dur').textContent=fmt(audio.duration)}});
audio.addEventListener('timeupdate',function(){
 $('cur').textContent=fmt(audio.currentTime);
 $('ring').setAttribute('aria-valuenow',audio.duration?Math.round(audio.currentTime/audio.duration*100):0);
});
$('play').onclick=function(){if(idx<0)$('file').click();else toggle()};
$('prev').onclick=function(){if(audio.currentTime>3||idx<1)audio.currentTime=0;else load(idx-1,true)};
$('next').onclick=function(){if(idx<tracks.length-1)load(idx+1,true)};
var ring=$('ring'),sk=false;
function seekRing(e){
 var r=ring.getBoundingClientRect(),a=Math.atan2(e.clientY-(r.top+r.height/2),e.clientX-(r.left+r.width/2))+Math.PI/2;
 if(a<0)a+=2*Math.PI;if(audio.duration)audio.currentTime=a/(2*Math.PI)*audio.duration;
}
ring.onpointerdown=function(e){sk=true;ring.setPointerCapture(e.pointerId);seekRing(e)};
ring.onpointermove=function(e){if(sk)seekRing(e)};
ring.onpointerup=ring.onpointercancel=function(){sk=false};
ring.onkeydown=function(e){if(e.key==='ArrowRight'||e.key==='ArrowUp')audio.currentTime+=5;if(e.key==='ArrowLeft'||e.key==='ArrowDown')audio.currentTime-=5};
/* glass volume */
var gv=$('gv'),vw=$('vw'),dv=false;
function setVol(v){
 v=Math.max(0,Math.min(1,v));audio.volume=v;vw.style.setProperty('--v',v);
 $('gn').textContent=Math.round(v*100);gv.setAttribute('aria-valuenow',Math.round(v*100));
}
function fromX(x){var r=gv.getBoundingClientRect();setVol((x-r.left)/r.width)}
gv.onpointerdown=function(e){dv=true;gv.setPointerCapture(e.pointerId);fromX(e.clientX)};
gv.onpointermove=function(e){if(dv)fromX(e.clientX)};
gv.onpointerup=gv.onpointercancel=function(){dv=false};
gv.addEventListener('wheel',function(e){setVol(audio.volume-Math.sign(e.deltaY)*.04)},{passive:true});
gv.onkeydown=function(e){var k=e.key;if(k==='ArrowRight'||k==='ArrowUp'){e.preventDefault();setVol(audio.volume+.05)}else if(k==='ArrowLeft'||k==='ArrowDown'){e.preventDefault();setVol(audio.volume-.05)}else if(k==='Home')setVol(0);else if(k==='End')setVol(1)};
setVol(.8);

$('drop').onclick=function(){$('file').click()};
$('file').onchange=function(){var files=Array.prototype.slice.call(this.files);this.value='';window.setTimeout(function(){addFiles(files)},0)};
['dragenter','dragover'].forEach(function(ev){document.addEventListener(ev,function(e){e.preventDefault();$('drop').classList.add('over')})});
['dragleave','drop'].forEach(function(ev){document.addEventListener(ev,function(e){e.preventDefault();$('drop').classList.remove('over');if(ev==='drop'&&e.dataTransfer)addFiles(e.dataTransfer.files)})});
document.addEventListener('keydown',function(e){if(e.code==='Space'&&e.target===document.body){e.preventDefault();$('play').click()}});
draw();
})();
</script>
</body>
</html>
