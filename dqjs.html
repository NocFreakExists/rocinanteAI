<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050505">
  <title>—</title>
  <link rel="icon" href="favicon.webp" type="image/webp">
  <style>
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;height:100dvh;margin:0;overflow:hidden;background:#050505}
    body{position:fixed;inset:0}
    #scare{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;user-select:none;-webkit-user-drag:none;animation:appear .22s ease-out both}
    #redOverlay{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,rgba(150,0,12,.18) 20%,rgba(110,0,10,.48) 100%),linear-gradient(180deg,rgba(255,20,30,.2),rgba(90,0,8,.36));mix-blend-mode:multiply;animation:bloodPulse 2.8s ease-in-out infinite}
    @keyframes appear{from{opacity:.15;transform:scale(1.035)}to{opacity:1;transform:scale(1)}}
    @keyframes bloodPulse{0%,100%{opacity:.68}50%{opacity:1}}
    @media(prefers-reduced-motion:reduce){#scare,#redOverlay{animation:none}}
  </style>
</head>
<body>
  <img id="scare" src="dqjs.png" alt="" draggable="false">
  <div id="redOverlay" aria-hidden="true"></div>
  <audio id="scareAudio" src="dsjq-audio.mp3" autoplay loop preload="auto"></audio>
  <script>
    (function(){
      var sound=document.getElementById('scareAudio');
      function startSound(){sound.play().catch(function(){});}
      sound.addEventListener('canplay',startSound,{once:true});
      startSound();
    })();
  </script>
</body>
</html>
